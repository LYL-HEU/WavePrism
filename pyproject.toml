[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveprism"
version = "0.1.0"
description = "Global probabilistic ocean-wave forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=2.0", "h5py>=3.8", "netCDF4>=1.6", "tqdm>=4.65", "scipy>=1.10"]

[tool.setuptools.packages.find]
include = ["waveprism*"]
